@if(isNewTaskAdding){
    <app-new-task (closeDialog)="onCloseDialog()" (addNewTask)="onAddingNewTask($event)"></app-new-task>
}

<section id="tasks">
    <header>
        <h2>{{user?.name}}'s Tasks</h2>
        <menu>
            <button (click)="addNewTask()">Add Task</button>
        </menu>
    </header>

    <ul>
        @for(task of selectedUserTask; track task.id){
            <li>
                <app-task [task]="task" (taskCompleted)="OnCompletionTask($event)"></app-task>
            </li>
        }
        
    </ul>
</section>

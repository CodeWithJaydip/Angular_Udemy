<app-header></app-header>
<main>
  <ul id="users">
    @for(user of users; track $index){
      <li>
        <app-user [selected]="user.id ===selectedUser?.id" [user]="user" (selectedUser)="SelectedUser($event)"></app-user>
      </li>
    }
  
  </ul>
  <app-tasks [user]="selectedUser"></app-tasks>
</main>
